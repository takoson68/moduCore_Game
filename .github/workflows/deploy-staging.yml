name: Deploy staging

on:
  push:
    branches:
      - world-oop
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'M1 安全失敗演練：在遠端 migration 與部署前停止'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has-targets: ${{ steps.targets.outputs.has-targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - id: targets
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_BEFORE: ${{ github.event.before }}
          DEPLOY_AFTER: ${{ github.sha }}
        run: node platform/worker/scripts/select-deploy-targets.mjs

  deploy:
    needs: plan
    if: needs.plan.outputs.has-targets == 'true'
    name: Deploy ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: ${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            platform/frontend/package-lock.json
            platform/worker/package-lock.json

      - name: Install frontend dependencies
        working-directory: platform/frontend
        run: npm ci

      - name: Build isolated project assets
        working-directory: platform/frontend
        env:
          VITE_PROJECT: ${{ matrix.project }}
          VITE_API_MODE: real
        run: npm run build:cloudflare -- --outDir ../worker/.assets/${{ matrix.target }}

      - name: Test frontend API token transport
        working-directory: platform/frontend
        run: npm run test:api

      - name: Test project-b login panel
        if: matrix.project == 'project-b'
        working-directory: platform/frontend
        run: |
          npm run test:project-b-auth
          npm run test:employee

      - name: Install Worker dependencies
        working-directory: platform/worker
        run: npm ci

      - name: Test Worker
        working-directory: platform/worker
        run: npm test

      - name: Verify Worker bundle
        working-directory: platform/worker
        run: npm run check -- --config wrangler.${{ matrix.target }}.json

      - name: Simulate safe staging failure
        if: ${{ inputs.simulate_failure == true }}
        run: |
          echo 'M1 failure drill: stop before remote migrations and deployment.'
          exit 1

      - name: Apply D1 migrations
        working-directory: platform/worker
        run: npm run db:migrate:remote -- --config wrangler.${{ matrix.target }}.json

      - name: Deploy Worker and Static Assets
        working-directory: platform/worker
        run: npm run deploy -- --config wrangler.${{ matrix.target }}.json

      - name: Verify public staging endpoints
        working-directory: platform/worker
        run: node scripts/smoke.mjs https://${{ matrix.target }}.takoson68.workers.dev ${{ matrix.target }}

      - name: Verify remote authentication and D1 session lifecycle
        working-directory: platform/worker
        env:
          VERIFY_PEER_ISOLATION: '1'
        run: node scripts/smoke-auth-remote.mjs ${{ matrix.target }}

      - name: Verify project-b Employee API
        if: matrix.project == 'project-b'
        working-directory: platform/worker
        run: node scripts/smoke-employees-remote.mjs --execute-staging
